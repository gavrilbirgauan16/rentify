# Verificare automata (CI = Continuous Integration).
# La fiecare "git push" si la fiecare Pull Request, GitHub instaleaza proiectul pe un calculator curat,
# verifica stilul codului (ESLint), construieste interfata React si ruleaza testele.
# Rezultatul apare ca ✅ sau ❌ langa commit.
name: Teste

on:
  push:
  pull_request:

jobs:
  verificare:
    runs-on: ubuntu-latest

    # O baza PostgreSQL temporara, doar pentru testele de integrare. GitHub o porneste goala si o sterge dupa rulare;
    # nu are nicio legatura cu baza de pe calculator. Parola de aici nu e un secret (baza exista doar cateva minute).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentify_test
        ports:
          - 5432:5432
        # asteptam sa porneasca de-a binelea inainte de teste
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descarca codul
        uses: actions/checkout@v4

      - name: Instaleaza Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # doua proiecte npm (serverul si interfata React), deci doua liste de pachete de tinut minte
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Instaleaza pachetele (exact versiunile din package-lock.json)
        run: npm ci
        
      # npm nu mai ruleaza automat scripturile pachetelor (deci nici "prisma generate").
      # Generam clientul Prisma explicit: codul care foloseste baza de date are nevoie de el. Nu cere o baza de date.
      - name: Genereaza clientul Prisma
        run: npx prisma generate

      - name: Verifica codul (ESLint)
        run: npm run lint

      - name: Ruleaza testele unitare
        run: npm test

      # Interfata React (client/) are pachetele ei. "build" o impacheteaza pentru publicare: daca un fisier
      # are o greseala care o opreste (import gresit, sintaxa), CI-ul devine rosu.
      - name: Instaleaza pachetele interfetei React
        run: npm ci --prefix client

      - name: Construieste interfata React
        run: npm run build --prefix client

      # Testele de integrare: API-ul cu baza reala (cea temporara de mai sus). Scriptul reface baza din migrari,
      # apoi ruleaza test/integrare/. Setarile de mai jos sunt doar pentru teste, nu secrete reale.
      - name: Ruleaza testele de integrare (API + PostgreSQL)
        run: npm run test:integrare
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentify_test
          SESSION_SECRET: cheie-de-sesiune-doar-pentru-teste-in-ci-0123456789
          API_KEY: cheie-api-doar-pentru-teste-in-ci-0123456789abcdef